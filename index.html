<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pizza Coin - Pay with Visa MC or PayPal</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
        overflow-x: hidden; /* Prevents unwanted horizontal scrolling */
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px;

        border: 8px solid #39ff14;

        box-shadow:
            inset 0 0 20px #39ff14,
            inset 0 0 50px #39ff14,
            0 0 20px #39ff14,
            0 0 50px #39ff14;

        color: #fff;
    }

    .checkout-box {
        width: 100%;
        max-width: 650px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        text-align: center;

        padding: 30px 15px;

        border: 4px solid #39ff14;
        border-radius: 25px;

        box-shadow:
            0 0 15px #39ff14,
            0 0 35px #39ff14,
            inset 0 0 20px rgba(57,255,20,0.25);
    }

    h1, h2, .secure {
        /* Prevents text from spilling off edges */
        overflow-wrap: break-word;
        word-break: break-word;
        hyphens: auto;
        max-width: 100%;
    }

    h1 {
        margin: 0 0 12px 0;

        font-size: clamp(28px, 6vw, 58px);
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;

        color: #39ff14;

        text-shadow:
            0 0 5px #39ff14,
            0 0 10px #39ff14,
            0 0 20px #39ff14,
            0 0 40px #39ff14;
    }

    h2 {
        margin: 0 0 25px 0;

        font-size: clamp(16px, 4vw, 30px);
        font-weight: 900;

        color: #fff;

        text-shadow:
            0 0 5px #39ff14,
            0 0 12px #39ff14;
    }

    .paypal-area {
        width: 100%;
        max-width: 500px;

        /* Flexibility ensures buttons inside render properly without overflow */
        display: flex;
        align-items: center;
        justify-content: center;

        padding: 15px;
        background: #fff;

        border: 3px solid #39ff14;
        border-radius: 18px;

        box-shadow:
            0 0 15px #39ff14,
            0 0 30px #39ff14;
            
        /* Ensures tap/click events respond properly on Android touchscreens */
        touch-action: manipulation;
        position: relative;
        z-index: 10;
    }

    #paypal-container-A7Y3UP7FPV86A {
        width: 100%;
        max-width: 450px;
        position: relative;
        z-index: 11;
    }

    .secure {
        margin-top: 25px;

        font-size: clamp(14px, 3.5vw, 16px);
        font-weight: 900;

        color: #39ff14;

        text-transform: uppercase;

        text-shadow:
            0 0 6px #39ff14,
            0 0 12px #39ff14;
    }

    @media (max-width: 600px) {
        body {
            border-width: 4px;
            padding: 8px;
        }

        .checkout-box {
            padding: 20px 10px;
            border-width: 3px;
        }

        .paypal-area {
            padding: 10px;
        }
    }
</style>

<!-- PayPal SDK -->
<script
    src="https://www.paypal.com/sdk/js?client-id=BAAD6tp9GGPNolM5XDQ1JVr0cfhZv3Y9vT_TIPSwqsYPKuHiOb2z1soff0v9ykTk2_68MhGIFgx8rfhj00&components=hosted-buttons&disable-funding=venmo&currency=USD">
</script>

</head>

<body>

<div class="checkout-box">

    <h1>PIZZA COIN</h1>

    <h2>PAY WITH VISA MC OR PAYPAL HERE</h2>

    <div class="paypal-area">
        <div id="paypal-container-A7Y3UP7FPV86A"></div>
    </div>

    <div class="secure">
        🔒 SECURE CHECKOUT 🔒
    </div>

</div>

<script>
    paypal.HostedButtons({
        hostedButtonId: "A7Y3UP7FPV86A",
    }).render("#paypal-container-A7Y3UP7FPV86A");
</script>

</body>
</html>
